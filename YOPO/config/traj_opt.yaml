# IMPORTANT: velocity in testing (modifiable)
velocity: 6.0

# IMPORTANT: vel_max and acc_max in training
# not the actual values in testing, ensure consistency between testing and training, please refer to ../policy/primitive.py
vel_max_train: 6.0
acc_max_train: 6.0

# IMPORTANT: weight of costs for unit speed (can be visualized in tensorboard)
wg: 0.15   # guidance     (approaching the goal)
ws: 12.0   # smoothness   (smaller jerk)
wa: 1.2    # acceleration (smaller acceleration)
wc: 1.4    # collision    (distance to obstacle)
wi: 2.0    # desired velocity intent

# dataset: set image_size = primitive_num × downsampling_factor (×32 for ResNet-18) in each axis
dataset_path: "../dataset_omni"
image_height: 8
image_width: 8
tof_horizontal_fov_deg: 45.0
tof_vertical_fov_deg: 45.0

# YOPO-Omni params
omni_topology_num: 8
omni_d_model: 128
omni_num_heads: 4
omni_decoder_layers: 2
omni_ffn_dim: 512
omni_dropout: 0.1
omni_radius_min: 1.0
omni_radius_max: 9.0
omni_pitch_max_deg: 35.0
omni_guide_points: 32
omni_loss_eval_points: 30
omni_intent_min_progress: 1.2
omni_vdes_speed_min: 3.0
omni_vdes_speed_max: 6.0
omni_vel_noise_std: 0.4
omni_acc_noise_std: 0.45
omni_num_workers: 4
omni_depth_cache_size: 64
omni_amp: true
omni_max_grad_norm: 1.0

# Dijkstra guide is always generated in dataset, but this loss can be disabled.
use_guidance_loss: false
w_guide_path: 1.0
w_explore: 0.3
omni_explore_beta: 16.0
w_score: 1.0
w_rank: 0.0
omni_rank_margin: 0.1
omni_rank_min_gap: 0.2

# trajectory and primitive param (Note: traj_time = 2 * radio / vel_max) (can be visualized in rviz)
horizon_num: 5
vertical_num: 3
horizon_camera_fov: 90.0
vertical_camera_fov: 60.0
horizon_anchor_fov: 30.0
vertical_anchor_fov: 30.0
radio_range: 5.0    # planning horizon: 2 * radio_range
sgm_time: 1.4       # default glook_exp_mid trajectory time
radio_num: 1        # only support 1 currently

# safety penalties
d0: 1.2
r: 0.6

# distribution for unit state sampling (can be visualized by 'python ./policy/yopo_dataset.py')
vx_mean_unit: 0.4
vy_mean_unit: 0.0
vz_mean_unit: 0.0
vx_std_unit: 2.0
vy_std_unit: 0.45
vz_std_unit: 0.3
ax_mean_unit: 0.0
ay_mean_unit: 0.0
az_mean_unit: 0.0
ax_std_unit: 0.5
ay_std_unit: 0.5
az_std_unit: 0.3
goal_pitch_std: 10.0  # clip goal_length to: 2 * radio_range; 10% probability [0, 2 * radio_range]
goal_yaw_std: 20.0

# extend the map to avoid trajectory exceeding bounds (especially in z-axis) and treating the sky outside the map as obstacle
map_expand_min: [0, 0, 0.2]
map_expand_max: [0, 0, 6.0]
