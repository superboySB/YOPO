# Unified YOPOv2-Tracker config for training and swarm/single-UAV testing.

velocity: 5

vel_max_train: 6.0
acc_max_train: 6.0

# Loss weights.
# smoothness_weight and acceleration_weight are raw config weights; the trainer
# scales them internally by vel_max_train to keep tuning comparable across speed.
trajectory_loss_weight: 1.0
score_loss_weight: 1.0
smoothness_weight: 2.0
acceleration_weight: 1.0
static_safety_weight: 5.0
dynamic_safety_weight: 10.0
goal_weight: 0.5
target_separation_weight: 50.0

# Guidance sub-loss knobs.
guidance_perp_weight: 0.8
guidance_velocity_direction_weight: 0.05

dataset_path: "../dataset"
image_height: 96
image_width: 160
camera_fx: 46.1880215
camera_fy: 48.0
camera_cx: 80.0
camera_cy: 48.0
input_channels: 2
observation_dim: 9
output_dim: 10

horizon_num: 5
vertical_num: 3
horizon_camera_fov: 120.0
vertical_camera_fov: 90.0
horizon_anchor_fov: 30.0
vertical_anchor_fov: 30.0
radio_range: 5.0
radio_num: 1

d0: 1.2
r: 0.6

vx_mean_unit: 0.4
vy_mean_unit: 0.0
vz_mean_unit: 0.0
vx_std_unit: 2.0
vy_std_unit: 0.45
vz_std_unit: 0.3
ax_mean_unit: 0.0
ay_mean_unit: 0.0
az_mean_unit: 0.0
ax_std_unit: 0.5
ay_std_unit: 0.5
az_std_unit: 0.3
goal_pitch_std: 10.0
goal_yaw_std: 20.0

map_expand_min: [0, 0, 0.2]
map_expand_max: [0, 0, 6.0]

target_ellipsoid_size: [0.31, 0.31, 0.14]
# Center-distance radius used by train/eval dynamic safety for UAV-UAV collision.
# Matches the simulator default: own 0.155m radius + observed UAV 0.155m radius.
dynamic_safety_radius: 0.31
target_dynamic_max_count: 3
target_mask_timeout: 0.25
target_mask_min_pixels: 4

# Swarm distance knobs: edit these here only.
# swarm_initial_spacing controls both the launch-time formation layout and
# the visible-target separation loss, keeping training and swarm tests aligned.
# swarm_arrive_radius controls when each UAV is considered successful.
swarm_initial_spacing: 2.0
swarm_arrive_radius: 4.0

# Loss sampling knobs: keep static ESDF at the original YOPO density.
static_safety_eval_points: 30
dynamic_safety_eval_points: 10
target_separation_eval_points: 10
