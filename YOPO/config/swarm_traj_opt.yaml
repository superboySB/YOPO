# IMPORTANT: velocity in testing (modifiable)
velocity: 3

# IMPORTANT: vel_max and acc_max in training
# not the actual values in testing; primitive.py rescales them using
# ratio = velocity / vel_max_train, so the decoded test-time limits become:
# vel_max_test = velocity
# acc_max_test = acc_max_train * (velocity / vel_max_train)^2
vel_max_train: 3.0
acc_max_train: 6.0

# IMPORTANT: weight of costs for unit speed
wg: 0.15
ws: 10.0
wa: 1.0
wc: 1.0

# dataset
# Keep 160x96 so the ResNet-18 backbone still outputs a 3x5 feature grid;
# swarm depth images can be resized from the raw camera resolution (e.g. 120x80).
dataset_path: "../dataset_swarm"
image_height: 96
image_width: 160

# trajectory and primitive param (Note: traj_time = 2 * radio / vel_max in training;
# test-time segment_time is rescaled in primitive.py and becomes 2 * radio_range / velocity)
horizon_num: 5
vertical_num: 3
horizon_camera_fov: 120.0
vertical_camera_fov: 80.0
# Anchor FOV controls the per-primitive angular offset range during decoding,
# not the output grid size. Keeping 30x30 preserves the original output semantics
# while still overlapping adjacent primitive bins under the wider 120x80 camera FOV.
horizon_anchor_fov: 30.0
vertical_anchor_fov: 30.0
radio_range: 5.0
radio_num: 1

# safety penalties
d0: 1.2
r: 0.6

# distribution for unit state sampling
vx_mean_unit: 0.4
vy_mean_unit: 0.0
vz_mean_unit: 0.0
vx_std_unit: 2.0
vy_std_unit: 0.45
vz_std_unit: 0.3
ax_mean_unit: 0.0
ay_mean_unit: 0.0
az_mean_unit: 0.0
ax_std_unit: 0.5
ay_std_unit: 0.5
az_std_unit: 0.3
goal_pitch_std: 10.0
goal_yaw_std: 20.0

# extend the map to avoid trajectory exceeding bounds
map_expand_min: [0, 0, 0.2]
map_expand_max: [0, 0, 6.0]
