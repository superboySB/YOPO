# 1. ROS节点参数 =============================================================
odom_topic: "/sim/odom"
depth_topic: "/depth_image"
lidar_topic: "/lidar_points"

render_depth: true
depth_fps: 33          # odom 100hz, depth 33hz, 每3帧odom渲染一次

render_lidar: true
lidar_fps: 10

# 2. 仿真环境参数 =============================================================
random_map: true       # 使用预先建立的点云地图还是随机地图
resolution: 0.05       # 地图分辨率；窄缝边框需要更细体素才会渲染成矩形

# 2.1 预先建立的点云地图 (此分支已弃用)
ply_file: ""
expand_x_times: 0      # x方向复制次数（cuda版不使用）
expand_y_times: 0      # y方向复制次数（cuda版不使用）
occupy_threshold: 0    # 大于多少个点才认为占据（cpu版不使用）
map_mirror_xy: false   # gate 场景必须关闭；原随机地图可设 true 做无限镜像平铺

# 2.2 随机地图 / gate 场景 ======
seed: 3
x_length: 10           # gate 场景局部边界，给 start/goal 和过门后的恢复段留出更宽余量
y_length: 6
z_length: 3
maze_type: 8           # 8: 单个中空 gate frame；不生成树林/整面墙
# 溶洞
complexity: 0.02       # 复杂度 0.0-0.5
fill: 0.1              # 填充率 0.0-0.4
fractal: 1
attenuation: 0.1
# 柱子
width_min: 0.6
width_max: 1.5
obstacle_number: 100
# 迷宫
road_width: 3
add_wall_x: 1
add_wall_y: 1
# 窄缝 gate frame：只生成外框和内洞之间的边框体素，不生成整面墙。
gate_enabled: true
gate_roll_deg: 85.0
gate_slit_roll_deg: 85.0  # same semantics as gcopter gate_slit_roll_deg; overrides gate_roll_deg when present
gate_random_slit_roll: true   # dataset_generator only; online test keeps gate_slit_roll_deg fixed
gate_slit_roll_min_deg: 0.0
gate_slit_roll_max_deg: 90.0
gate_pitch_deg: 0.0
gate_yaw_deg: 0.0
gate_x: 0.0
gate_y: 0.0
gate_z: 1.20
gate_count: 1
gate_spacing: 3.0
# A single hollow gate frame. Local +x is normal, local y/z are opening axes.
# Border thickness comes from (outer - inner) / 2; depth is along local x.
gate_outer_width: 0.88
gate_outer_length: 0.38
gate_inner_width: 0.70
gate_inner_length: 0.30
gate_depth: 0.05
gate_depth_margin: 0.01
gate_point_resolution: 0.02
add_ground_points: true    # 恢复可见地面，和原版随机地图一样生成规则地面点云
occupy_below_ground: true  # 保留地下/贴地碰撞边界，避免无地面观测时一路下钻
gate_wall_width: 8.0
gate_wall_length: 8.0
gate_wall_fill_boundary: true   # 生成整面薄墙，只给 gate inner opening 留洞，防止从旁边绕行

# UAV collision box used by simulator collision checking.
uav_collision_box_width: 0.34
uav_collision_box_depth: 0.34
uav_collision_box_height: 0.13
# 房间
room_number: 4         # 每个方向上的房间数 (房间大小 = x_length / room_number)
max_windows: 2         # 每面墙最多窗口数
window_size_min: 2.0
window_size_max: 2.8
add_ceiling: 0         # 是否添加天花板
# 墙面
wall_width_min: 0.5
wall_width_max: 6.0
wall_thick: 0.5
wall_number: 100       # 墙面数量
wall_ceiling: 1        # 是否添加天花板

# 3. 传感器参数 ==============================================================
camera:
  fx: 80.0             # focal length x
  fy: 80.0             # focal length y
  cx: 80.0             # principal point x (image center)
  cy: 45.0              # principal point y (image center)
  image_width: 160
  image_height: 90
  max_depth_dist: 20.0
  normalize_depth: false
  pitch: -0.0           # 相机相对机体的俯仰角 (仰为负, cpu版尚未添加)

lidar:
  vertical_lines: 16             # 纵向16线
  vertical_angle_start: -15.0    # 起始垂直角度
  vertical_angle_end: 15.0       # 结束垂直角度
  horizontal_num: 360            # 水平360点
  horizontal_resolution: 1.0     # 水平分辨率为1度，horizontal_resolution * horizontal_num = 360
  max_lidar_dist: 20.0

# 4. 数据收集参数 =============================================================
save_path: "../dataset/"
env_num: 10             # 地图数量
image_num: 10000        # 每个地图收集图像数量
roll_range: 30          # 采样点的roll角度范围
pitch_range: 30         # 采样点的pitch角度范围
x_range: 6              # gate-only fallback 采样范围；默认 100% 使用 gate 采样
y_range: 2.2
z_range: [0.6, 1.8]
safe_dist: 0.5          # 安全距离，采样点与障碍的最小距离
ply_res: 0.02           # 保存训练 ESDF 点云，需避免体素质心落入 gate 洞内
gate_pose_sample_ratio: 1.0
gate_sample_x_min: 0.9
gate_sample_x_max: 2.8
gate_sample_y_range: 0.9
gate_sample_z_range: 0.45
gate_sample_center_ratio: 0.80
gate_sample_y_std: 0.22
gate_sample_z_std: 0.14
gate_pose_yaw_noise_deg: 8.0
