# 1. ROS节点参数 =============================================================
odom_topic: "/sim/odom"
depth_topic: "/depth_image"
lidar_topic: "/lidar_points"

render_depth: true
depth_fps: 15          # Insight 9 depth output rate

render_lidar: true
lidar_fps: 10

# Active-perception control variable.  Keep every other sensor/map/training
# setting identical when comparing true against false.
active_camera: true

# 2. 仿真环境参数 =============================================================
random_map: true       # 使用预先建立的点云地图还是随机地图
resolution: 0.1        # 地图分辨率
map_viz_resolution: 0.8 # RViz全局地图点云降采样分辨率
uav_collision_radius: 0.35 # 碰撞按无人机球形外形而非仅中心点判定
collision_hysteresis: 0.10 # 离开碰撞区后再次进入才计为新事件

# 2.1 预先建立的点云地图 (此分支已弃用)
ply_file: "src/pointcloud/forest.ply"
expand_x_times: 0      # x方向复制次数（cuda版不使用）
expand_y_times: 0      # y方向复制次数（cuda版不使用）
occupy_threshold: 0    # 大于多少个点才认为占据（cpu版不使用）

# 2.2 随机地图 ======
seed: 3                # 训练env_num=10时使用3..12；建议独立评测使用101..105
x_length: 60           # 真正随机范围(XY更大范围处为其镜像)
y_length: 60
z_length: 15
maze_type: 2           # 1:溶洞 2:柱子 3:2D迷宫 4:3D迷宫 5:森林 6:房间 7:随机墙 8:主动感知S/T盲角赛道
# 溶洞
complexity: 0.02       # 复杂度 0.0-0.5
fill: 0.1              # 填充率 0.0-0.4
fractal: 1
attenuation: 0.1
# 柱子
width_min: 0.6
width_max: 1.5
obstacle_number: 100
# 迷宫
road_width: 3
add_wall_x: 1
add_wall_y: 1
# 森林
tree_file: "src/pointcloud/tree.ply"
tree_dist: 4
# 房间
room_number: 4         # 每个方向上的房间数 (房间大小 = x_length / room_number)
max_windows: 2         # 每面墙最多窗口数
window_size_min: 2.0
window_size_max: 2.8
add_ceiling: 0         # 是否添加天花板
# 墙面
wall_width_min: 0.5
wall_width_max: 6.0
wall_thick: 0.5
wall_number: 100       # 墙面数量
wall_ceiling: 1        # 是否添加天花板

# 主动感知盲角赛道 (maze_type=8)
# 基准航线 start=(-20,0,2), goal=(20,0,2)。两点都在默认训练采样范围内。
# 直线被折流墙阻断，
# 但中心线始终留有可通行的S形绕行；seed只会镜像且小幅扰动拐点。
active_chicane_corridor_width: 4.0
active_chicane_wall_height: 5.0
active_chicane_wall_thickness: 0.30
active_chicane_lateral_offset: 6.0
active_chicane_branch_length: 6.0
active_chicane_jitter: 0.25
active_chicane_ceiling: true # 封闭越墙空域，避免从5m墙顶上方绕过盲角

# 3. 传感器参数 ==============================================================
insight9:              # Looper Robotics Insight 9 learning-stereo model
  model: "looper_insight_9"
  native_image_width: 544
  native_image_height: 640
  image_width: 160     # full-FoV network/render width; see depth_preprocess contract
  image_height: 192
  horizontal_fov_deg: 96.8
  vertical_fov_deg: 115.6
  diagonal_fov_deg: 157.2
  depth_fps: 15
  max_depth_dist: 20.0 # train range; device ideal range is 0.3-30m
  min_depth_dist: 0.19
  depth_accuracy_ratio: 0.02
  normalize_depth: false
  mount_x: 0.10
  mount_y: 0.0
  mount_z: 0.03
  pitch_limit_deg: 60.0
  yaw_limit_deg: 45.0
  servo_tau_s: 0.25
  servo_max_rate_deg_s: 120.0

# CPU raycaster compatibility. The documented workflow uses the CUDA node,
# which additionally simulates the two-axis gimbal above.
camera:
  fx: 71.0
  fy: 60.5
  cx: 79.5
  cy: 95.5
  image_width: 160
  image_height: 192
  max_depth_dist: 20.0
  normalize_depth: false
  pitch: 0.0

lidar:
  vertical_lines: 16             # 纵向16线
  vertical_angle_start: -15.0    # 起始垂直角度
  vertical_angle_end: 15.0       # 结束垂直角度
  horizontal_num: 360            # 水平360点
  horizontal_resolution: 1.0     # 水平分辨率为1度，horizontal_resolution * horizontal_num = 360
  max_lidar_dist: 20.0

# 4. 数据收集参数 =============================================================
save_path: "../dataset_active_v2/"
env_num: 10             # 地图数量
image_num: 10000        # 每地图正式采集图像数量；快速验收可通过流水线覆盖为500
roll_range: 30          # 采样点的roll角度范围
pitch_range: 30         # 采样点的pitch角度范围
x_range: 40             # x方向采样范围 (请小于地图大小x_length并保留一定边缘间距)
y_range: 40             # y方向采样范围 (请小于地图大小y_length并保留一定边缘间距)
z_range: [0.5, 4]       # z方向采样范围 (请小于地图大小z_length并保留一定边缘间距)
safe_dist: 0.5          # 安全距离，采样点与障碍的最小距离
ply_res: 0.1            # 保存点云滤波的体素网格大小

# 5. YOPO active-perception 数据标签参数 =====================================
omni:
  direction_num: 8          # 每个采样点展开为8个desired direction样本
  goal_length: 10.0         # Dijkstra局部目标距离(m)
  goal_z_margin: 0.2        # Dijkstra目标高度限制在 z_range 内并保留该边距(m)
  goal_search_radius: 3.0   # 目标落在障碍时，在该半径内寻找最近free目标(m)
  dijkstra_resolution: 0.5  # Dijkstra使用的粗栅格分辨率(m)
  dijkstra_inflation: 0.5   # Dijkstra障碍膨胀半径(m)
  astar_local_radius: 16.0  # A*局部搜索窗口在start-goal包围盒外扩半径(m)
  camera_gaze_lookahead_m: 4.0
