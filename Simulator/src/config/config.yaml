# 1. ROS节点参数 =============================================================
odom_topic: "/sim/odom"
depth_topic: "/depth_image"
lidar_topic: "/lidar_points"

render_depth: true
depth_fps: 50          # odom 100hz, depth 50hz, 高频深度更适合高速飞行

render_lidar: true
lidar_fps: 15
collision_count_min_z: 3.0 # 低于该高度不计碰撞，过滤起飞前/地面阶段的无效累计

# 2. 仿真环境参数 =============================================================
random_map: true       # 使用预先建立的点云地图还是随机地图
resolution: 1.0        # 地图分辨率(大尺度城市场景建议>=1.0, 避免体素地图过大)

# 2.1 预先建立的点云地图 (此分支已弃用)
ply_file: "src/pointcloud/forest.ply"
expand_x_times: 0      # x方向复制次数（cuda版不使用）
expand_y_times: 0      # y方向复制次数（cuda版不使用）
occupy_threshold: 0    # 大于多少个点才认为占据（cpu版不使用）

# 2.2 随机地图 ======
seed: 3
x_length: 1000         # 1km 级城市范围
y_length: 1000
z_length: 200
maze_type: 8           # 1: 溶洞 2: 柱子 3:迷宫 5:森林 6:房间 7:墙面 8:城市立方体楼群
# 溶洞
complexity: 0.02       # 复杂度 0.0-0.5
fill: 0.1              # 填充率 0.0-0.4
fractal: 1
attenuation: 0.1
# 柱子
width_min: 0.6
width_max: 1.5
obstacle_number: 100
# 迷宫
road_width: 3
add_wall_x: 1
add_wall_y: 1
# 森林
tree_file: "src/pointcloud/tree.ply"
tree_dist: 4
# 房间
room_number: 4         # 每个方向上的房间数 (房间大小 = x_length / room_number)
max_windows: 2         # 每面墙最多窗口数
window_size_min: 2.0
window_size_max: 2.8
add_ceiling: 0         # 是否添加天花板
# 墙面
wall_width_min: 0.5
wall_width_max: 6.0
wall_thick: 0.5
wall_number: 100       # 墙面数量
wall_ceiling: 1        # 是否添加天花板
# 城市立方体楼群 (maze_type=8)
city_block_spacing: 120.0      # 兼容旧参数(新逻辑主要由楼尺寸+街道宽度决定)
city_block_jitter: 0.0         # 兼容旧参数
city_street_min: 40.0          # 楼间距最小值 (m)；高速场景增大道路宽度
city_street_max: 80.0          # 楼间距最大值 (m)
city_block_occupancy: 0.8      # 楼块占据概率
city_block_width_min: 80.0     # 楼体x向尺寸最小值 (m)
city_block_width_max: 100.0    # 楼体x向尺寸最大值 (m)
city_block_length_min: 80.0    # 楼体y向尺寸最小值 (m)
city_block_length_max: 100.0   # 楼体y向尺寸最大值 (m)
city_block_height_min: 60.0    # 楼体高度最小值 (m)
city_block_height_max: 120.0   # 楼体高度最大值 (m)
city_surface_resolution: 1.0   # 楼体表面点采样分辨率 (m), 控制点云规模
city_ground_resolution: 2.0    # 地面采样分辨率 (m), 控制点云规模
city_extra_obstacle_num: 80    # 街道随机障碍物数量
city_extra_width_min: 6.0
city_extra_width_max: 20.0
city_extra_length_min: 6.0
city_extra_length_max: 20.0
city_extra_height_min: 4.0
city_extra_height_max: 25.0
city_add_ground: 1            # 是否生成地面
city_spawn_clear_radius: 70.0 # 起飞点净空半径，避免初始出生在建筑/障碍内部
city_spawn_clear_x: 0.0
city_spawn_clear_y: 0.0

# 3. 传感器参数 ==============================================================
camera:
  fx: 55.0             # focal length x
  fy: 55.0             # focal length y
  cx: 80.0             # principal point x (image center)
  cy: 45.0              # principal point y (image center)
  image_width: 160
  image_height: 90
  max_depth_dist: 500.0
  normalize_depth: false
  pitch: -25.0           # 相机相对机体的俯仰角 (仰为负, cpu版尚未添加)

lidar:
  vertical_lines: 24             # 提高垂直采样密度，减少“稀疏感”
  vertical_angle_start: -35.0    # 增大向下视角，高空时也能扫到地面/楼体近处
  vertical_angle_end: 15.0
  horizontal_num: 720            # 水平加密采样
  horizontal_resolution: 0.5     # 0.5 * 720 = 360 deg
  max_lidar_dist: 1000.0          # 城市场景扩大量程，近楼/前方楼体更容易被扫到

# 4. 数据收集参数 =============================================================
save_path: "../dataset/"
env_num: 10             # 地图数量
image_num: 10000        # 每个地图收集图像数量
roll_range: 35          # 基础姿态采样范围 (deg)
pitch_range: 20         # 基础姿态采样范围 (deg)
attitude_aggressive_ratio: 0.35  # 激进姿态采样占比，增强高速大倾斜视角覆盖
aggressive_roll_range: 65.0      # 激进姿态 roll 范围 (deg)
aggressive_pitch_range: 30.0     # 激进姿态 pitch 范围 (deg)
x_range: 700            # x方向采样范围(1km地图+160m展望下保留足够边界缓冲)
y_range: 700            # y方向采样范围(1km地图+160m展望下保留足够边界缓冲)
z_range: [46.0, 56.0]   # z方向采样范围 (围绕50m飞行高度采样)
safe_dist: 14.0         # 远障碍采样下限：采样点与障碍的最小距离
max_obs_dist: 140.0     # 采样上限：最近障碍若超过该距离则重采样，避免长期空白深度
near_obstacle_sample_ratio: 0.30  # 近障碍样本占比，增强 safety 学习
near_obstacle_min_dist: 4.0       # 近障碍样本最近距离下限（避免直接贴面）
near_obstacle_max_dist: 12.0      # 近障碍样本最近距离上限
city_inside_reject_margin: 0.5    # 城市中空建筑内部采样剔除边界 (m)
ply_res: 1.0            # 保存点云滤波的体素网格大小
