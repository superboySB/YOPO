# 1. ROS节点参数 =============================================================
odom_topic: "/sim/odom"
depth_topic: "/depth_image"
lidar_topic: "/lidar_points"

render_depth: true
depth_fps: 10

render_lidar: true
lidar_fps: 10

# 2. 仿真环境参数 =============================================================
random_map: true
resolution: 0.1
mock_map_leaf_size: 0.5  # /mock_map 仅用于 RViz 的可视化下采样体素大小

# 2.1 预先建立的点云地图
ply_file: "src/pointcloud/forest.ply"
expand_x_times: 0
expand_y_times: 0
occupy_threshold: 0

# 2.2 随机地图
seed: 3
x_length: 60
y_length: 60
z_length: 15
maze_type: 5           # 1: 溶洞 2: 柱子 3:迷宫 5:森林 6:房间 7:墙面
# 溶洞
complexity: 0.02
fill: 0.1
fractal: 1
attenuation: 0.1
# 柱子
width_min: 0.6
width_max: 1.5
obstacle_number: 100
# 迷宫
road_width: 3
add_wall_x: 1
add_wall_y: 1
# 森林
tree_file: "src/pointcloud/tree.ply"
tree_dist: 4
# 房间
room_number: 4
max_windows: 2
window_size_min: 2.0
window_size_max: 2.8
add_ceiling: 0
# 墙面
wall_width_min: 0.5
wall_width_max: 6.0
wall_thick: 0.5
wall_number: 100
wall_ceiling: 1

# 2.3 Swarm 参数 =============================================================
swarm:
  enabled: false
  uav_num: 4
  namespace_prefix: "uav"
  ring_radius: 16.0
  altitude: 2.0
  spawn_clear_radius: 2.6
  collision_radius: 0.25

# 2.4 Swarm 训练数据增强 =====================================================
swarm_dataset:
  enabled: true
  save_path: "../dataset_swarm/"
  placement_mode: "per_image"  # per_image: 为每张深度图单独采样球; map: 将球固定写入离线地图
  sphere_count_min: 0
  sphere_count_max: 3      # 对于 4 架无人机, 1~3 个球更接近“其余队友”的可见数量
  sphere_radius: 0.25      # 默认应与 swarm.collision_radius 保持一致
  sample_step: 0.05
  center_margin_xy: 4.0
  center_z_range: [1.2, 4.0]
  visible_depth_min: 0.2
  visible_depth_max: 20.0
  depth_margin: 0.8
  image_border: 8
  camera_clearance: 0.5
  static_clearance: 0.5
  min_center_distance: 0.6
  max_attempts_per_obstacle: 80

# 3. 传感器参数 ==============================================================
camera:
  fx: 34.64101615137755  # 120px width -> horizontal FOV 120 deg
  fy: 47.67014370376816  # 80px height -> vertical FOV 80 deg
  cx: 60.0
  cy: 40.0
  image_width: 120
  image_height: 80
  max_depth_dist: 20.0
  normalize_depth: false
  pitch: -0.0

lidar:
  vertical_lines: 16
  vertical_angle_start: -15.0
  vertical_angle_end: 15.0
  horizontal_num: 360
  horizontal_resolution: 1.0
  max_lidar_dist: 20.0

# 4. 数据收集参数 =============================================================
save_path: "../dataset_swarm/"
env_num: 10
image_num: 10000
roll_range: 30
pitch_range: 30
x_range: 40
y_range: 40
z_range: [0.5, 4]
safe_dist: 0.5
ply_res: 0.1
